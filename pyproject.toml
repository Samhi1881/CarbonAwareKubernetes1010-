[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-autoscaler"
version = "0.1.0"
description = "Carbon-aware Kubernetes autoscaling using multi-objective convex optimization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "cvxpy>=1.5", "ecos>=2.0.13", "statsmodels>=0.14", "matplotlib>=3.8", "kubernetes>=29.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
carbon-autoscaler = "carbon_autoscaler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
