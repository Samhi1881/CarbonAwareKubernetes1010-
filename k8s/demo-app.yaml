apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels: {app: demo-app}
spec:
  replicas: 4
  selector:
    matchLabels: {app: demo-app}
  template:
    metadata:
      labels: {app: demo-app}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          image: carbon-demo-app:latest
          imagePullPolicy: Never
          ports: [{containerPort: 8000}]
          env: [{name: WORK_MS, value: "10"}]
          resources:
            requests: {cpu: 200m, memory: 64Mi}
            limits:   {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
spec:
  type: NodePort
  selector: {app: demo-app}
  ports: [{port: 80, targetPort: 8000, nodePort: 30080}]
