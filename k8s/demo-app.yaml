apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels: {app: demo-app}
spec:
  replicas: 4            # start over-provisioned so the autoscaler has something to right-size
  selector:
    matchLabels: {app: demo-app}
  template:
    metadata:
      labels: {app: demo-app}
    spec:
      containers:
        - name: app
          image: carbon-demo-app:latest
          imagePullPolicy: Never       # image is imported into k3d, not pulled
          ports: [{containerPort: 8000}]
          env: [{name: WORK_MS, value: "25"}]
          resources:
            requests: {cpu: 200m, memory: 64Mi}
            limits:   {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
spec:
  selector: {app: demo-app}
  ports: [{port: 80, targetPort: 8000}]
